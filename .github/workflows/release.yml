name: release

permissions:
  pull-requests: write
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  release-rust-crates:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to clone all the git history, which is necessary to determine
          # the next version and build the changelog.
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # This is configured with trusted publishing from Github to crates.io
      - uses: MarcoIeni/release-plz-action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-website:
    needs: release-rust-crates
    uses: ./.github/workflows/deploy-website.yml
