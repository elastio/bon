[package]
name    = "doctests"
version = "0.1.0"

publish = false

description = "Crate for testing Rust code snippets in markdown files on the website."

edition = "2024"

[lints]
workspace = true

[dev-dependencies]
anyhow                = "1.0"
bon                   = { path = "../../bon", features = ["experimental-overwritable", "experimental-generics-setters"] }
buildstructor         = "0.6"
macro_rules_attribute = "0.2"
tokio                 = { version = "1.54", features = ["macros", "rt-multi-thread"] }
typed-builder         = "0.23"

[build-dependencies]
walkdir = "2.5"
